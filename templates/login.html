<!DOCTYPE html>
<html>

<head>
    <title>OTP Verification</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
</head>

<body>

    <div class="card">

        <h1>Two-Factor Verification</h1>

        <p>
            Enter your username and the 6-digit code from your
            authenticator app, then submit. Your webcam will open briefly
            to confirm your face &mdash; both must match <em>this</em>
            account.
        </p>

        <form method="POST" action="/verify">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <br><br>

            <input
                type="text"
                name="code"
                maxlength="6"
                pattern="[0-9]{6}"
                placeholder="Enter OTP"
                required
            >

            <button type="submit">
                Verify
            </button>

        </form>

        <p><a href="/register">Need to register or enroll your face?</a></p>

    </div>

</body>

</html>
